# main에 올리거나 PR을 열 때마다 세 프로젝트의 검사를 자동으로 돌린다.
# 외부 API 키는 필요 없다 — 백엔드 테스트는 외부 호출을 대체하고 인메모리 DB를 쓴다.
# 웹 e2e(Playwright)는 백엔드·웹 서버와 .env가 있어야 해서 여기서는 돌리지 않는다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test --console=plain

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # LayoutProps 등 Next.js 라우트 타입은 .next/types에 생성되므로 타입 검사 전에 만든다
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
