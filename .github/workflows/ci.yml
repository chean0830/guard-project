# main에 올리거나 PR을 열 때마다 세 프로젝트의 검사를 자동으로 돌린다.
# 외부 API 키는 필요 없다 — 백엔드 테스트는 외부 호출을 대체하고 인메모리 DB를 쓴다(운영 스키마 검사만 MySQL 컨테이너).
# 웹 e2e(Playwright)는 백엔드·웹 서버와 .env가 있어야 해서 여기서는 돌리지 않는다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # 운영 DB와 같은 MySQL에서 마이그레이션 스크립트와 엔티티가 맞는지 검사한다 (MySqlSchemaTest)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: project_guard_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_TEST_URL: jdbc:mysql://localhost:3306/project_guard_test
      MYSQL_TEST_USERNAME: root
      MYSQL_TEST_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test --console=plain

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # LayoutProps 등 Next.js 라우트 타입은 .next/types에 생성되므로 타입 검사 전에 만든다
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
