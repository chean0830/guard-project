spring.application.name=backend

# 카메라 촬영 사진은 장당 수 MB이고 여러 장을 함께 올릴 수 있어 기본값(1MB/10MB)으로는 부족하다.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# H2 콘솔은 기본적으로 켜져서 /h2-console 로 아무나 접근 가능했다 (실제로 열려있는 것 확인함).
# 회원 이메일/비밀번호 해시가 들어가는 지금은 반드시 꺼둬야 한다.
spring.h2.console.enabled=false

# 개발 중에는 인메모리 H2를 그대로 쓴다. 재시작하면 데이터가 초기화되는 것을 알고 있어야 한다
# (실제 배포 시에는 이미 의존성이 있는 PostgreSQL로 교체 예정).
spring.jpa.hibernate.ddl-auto=update

# 톰캣이 multipart/form-data의 텍스트 필드(파일이 아닌 값)를 기본적으로 ISO-8859-1로 읽어서,
# 한글 값(변호사 이름·소속 등)이 깨지는 문제가 실제로 발생하는 것을 라이브 테스트로 확인함.
# force=true로 요청 인코딩을 UTF-8로 강제해야 multipart 필드도 한글이 정상적으로 들어온다.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
