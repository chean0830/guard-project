spring.application.name=backend

# 카메라 촬영 사진은 장당 수 MB이고 여러 장을 함께 올릴 수 있어 기본값(1MB/10MB)으로는 부족하다.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# H2 콘솔은 기본적으로 켜져서 /h2-console 로 아무나 접근 가능했다 (실제로 열려있는 것 확인함).
# 회원 이메일/비밀번호 해시가 들어가는 지금은 반드시 꺼둬야 한다.
spring.h2.console.enabled=false

# 개발 중에는 인메모리 H2를 그대로 쓴다. 재시작하면 데이터가 초기화되는 것을 알고 있어야 한다
# (실제 배포 시에는 이미 의존성이 있는 PostgreSQL로 교체 예정).
# 개발은 엔티티를 바꾸면 테이블도 자동으로 맞춘다(update). 운영에서는 DDL_AUTO=validate로 두어 테이블을 몰래
# 바꾸지 않게 하고, 스키마 변경은 마이그레이션 스크립트로만 한다 (docs/결정사항.md 35번).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# 개발 DB 위치. .env에 DB_URL(파일 기반 H2)을 두면 서버를 재시작해도 회원·결제·상담 데이터가 남는다.
# 비어 있으면(테스트 등) 매번 새 인메모리 DB를 쓴다 — random.uuid로 이름을 달리해 테스트끼리 섞이지 않게 한다.
# (인메모리만 쓰던 시절, 개발 중 재시작으로 테스트 결제 이용권이 사라지는 일이 실제로 있었다.)
spring.datasource.url=${DB_URL:jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1}

# 톰캣이 multipart/form-data의 텍스트 필드(파일이 아닌 값)를 기본적으로 ISO-8859-1로 읽어서,
# 한글 값(변호사 이름·소속 등)이 깨지는 문제가 실제로 발생하는 것을 라이브 테스트로 확인함.
# force=true로 요청 인코딩을 UTF-8로 강제해야 multipart 필드도 한글이 정상적으로 들어온다.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 변호사에게 새 상담 문의 도착을 알리는 메일 발송 설정. MAIL_USERNAME이 비어있으면
# ConsultationMailService가 발송을 건너뛰고 경고 로그만 남긴다(앱은 정상 동작).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 변호사가 답장을 보내면 회원 브라우저로 웹 푸시 알림을 보낸다. 키가 비어있으면
# PushNotificationService가 발송을 건너뛰고 경고 로그만 남긴다(앱은 정상 동작).
push.vapid.public-key=${VAPID_PUBLIC_KEY:}
push.vapid.private-key=${VAPID_PRIVATE_KEY:}
push.vapid.subject=${VAPID_SUBJECT:mailto:example@example.com}
